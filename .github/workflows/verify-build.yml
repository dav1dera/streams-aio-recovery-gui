name: Safety tests and Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a new prerelease after all tests and the Windows self-test pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt 'PyYAML==6.0.3'
      - run: python -B -m unittest discover -s tests -v
      - name: Native SQLite and NPM integration with real root-owned fixtures
        shell: bash
        run: |
          set -euo pipefail
          recovery_python=$(python -c 'import sys; print(sys.executable)')
          root_temp=$(mktemp -d "$RUNNER_TEMP/recovery-root-fixtures.XXXXXX")
          sudo chown root:root "$root_temp"
          sudo chmod 700 "$root_temp"
          for test_file in test_snapshot_recovery_flow.py test_npm_topology.py test_npm_topology_flow.py; do
            sudo env TMPDIR="$root_temp" TEMP="$root_temp" TMP="$root_temp" "$recovery_python" -B -m unittest discover -s tests -p "$test_file" -v
          done
      - name: Verify the NPM domain and route helpers
        run: |
          node --experimental-vm-modules tests/check_domain_probe.mjs
          node --experimental-vm-modules tests/check_route_probe.mjs
      - name: Restore a real PostgreSQL 14 dump and roles using synthetic data
        run: python -B -m unittest discover -s tests -p test_postgres_roundtrip.py -v
        env:
          RECOVERY_DOCKER_INTEGRATION: '1'
      - run: python -m compileall -q recovery_gui remote main.py
      - run: bash -n remote/bootstrap.sh
  ubuntu-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['24.04', '26.04']
    container: ubuntu:${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the OS policy and install the actual bootstrap dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq python3
          DOCKER_SUITE=$(python3 remote/probe.py --docker-suite)
          export DOCKER_SUITE
          python3 - <<'PY' > /tmp/recovery-dependencies.sh
          from pathlib import Path
          shell = Path('remote/bootstrap.sh').read_text()
          start = shell.index('apt-get update -qq\n')
          end = shell.index('getent group docker')
          print('set -euo pipefail\nfail() { echo "$1"; exit 1; }\n' + shell[start:end])
          PY
          bash /tmp/recovery-dependencies.sh
          python3 -m venv /tmp/recovery-venv
          /tmp/recovery-venv/bin/python -m pip install --quiet -r remote/requirements-new-vm.txt
          /tmp/recovery-venv/bin/python -c 'import bcrypt, cryptography, jsonschema, yaml; from infisical_sdk import InfisicalSDKClient'
          /tmp/recovery-venv/bin/python -B -m unittest discover -s tests -p test_ubuntu_support.py -v
          RECOVERY_PERMISSION_INTEGRATION=1 /tmp/recovery-venv/bin/python -B -m unittest discover -s tests -p test_download_permissions.py -v
          RECOVERY_AGE_INTEGRATION=1 /tmp/recovery-venv/bin/python -B -m unittest discover -s tests -p test_age_identity.py -v
          /tmp/recovery-venv/bin/python -B -m unittest discover -s tests -p test_agent_archive.py -v
          /tmp/recovery-venv/bin/python -B -m unittest discover -s tests -p test_deployment_checkpoint.py -v
          /tmp/recovery-venv/bin/python -B -m unittest discover -s tests -p test_agent_installation.py -v
          /tmp/recovery-venv/bin/python -B -m unittest discover -s tests -p test_runtime_resume.py -v
          bash -n remote/bootstrap.sh
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          for name in ('docs/PROXMOX.md', 'docs/USAGE.md'):
              for code in re.findall(r'```bash\n(.*?)```', Path(name).read_text(), re.S):
                  subprocess.run(['bash', '-n'], input=code, text=True, check=True)
          print('DOCUMENTED_SHELL_SYNTAX PASS')
          PY
  windows:
    needs: [safety, ubuntu-compatibility]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name StreamsAIO-Recovery --add-data 'remote;remote' main.py
      - name: Check executable and bundled GUI dependencies
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./dist/StreamsAIO-Recovery.exe -ArgumentList '--self-test' -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Executable startup timed out' }
          if ($app.ExitCode -ne 0) { throw 'Executable startup failed' }
          $hash = (Get-FileHash -Algorithm SHA256 dist/StreamsAIO-Recovery.exe).Hash.ToLower()
          "$hash  StreamsAIO-Recovery.exe" | Set-Content -Encoding ascii dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: StreamsAIO-Recovery-Windows
          path: |
            dist/StreamsAIO-Recovery.exe
            dist/SHA256SUMS
          retention-days: 30
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: recovery-gui-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StreamsAIO-Recovery-Windows
          path: dist
      - name: Package tested source and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python -c "import re; from recovery_gui import __version__; assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', __version__); print('v' + __version__)")
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)" = true
          # A release/tag already present is never overwritten or moved.
          test -z "$(git ls-remote --tags origin "refs/tags/$tag")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'RELEASE_ALREADY_EXISTS'; exit 1
          fi
          python -c "from pathlib import Path; p=Path('dist/SHA256SUMS'); p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n'))"
          (cd dist && sha256sum -c SHA256SUMS)
          git archive --format=zip --output=dist/streams-aio-recovery-gui-source.zip "$GITHUB_SHA"
          (cd dist && sha256sum StreamsAIO-Recovery.exe streams-aio-recovery-gui-source.zip > SHA256SUMS)
          gh release create "$tag" dist/StreamsAIO-Recovery.exe dist/streams-aio-recovery-gui-source.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "Streams AIO Recovery $tag" --notes-file docs/RELEASE-NOTES.md
          mkdir -p dist/verified
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist/verified
          (cd dist/verified && sha256sum -c SHA256SUMS)
          cmp dist/SHA256SUMS dist/verified/SHA256SUMS
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "RELEASE_UPLOAD_VERIFY PASS tag=$tag commit=$GITHUB_SHA"
