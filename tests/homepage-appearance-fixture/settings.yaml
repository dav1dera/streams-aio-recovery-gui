title: La mia Homepage
description: Ricerca, servizi e stato della VM
theme: dark
color: slate
language: it
headerStyle: clean
fullWidth: false
disableCollapse: false
showStats: false
statusStyle: dot
useEqualHeights: true
target: _blank
hideVersion: true
logpath: /app
layout:
  Sistema:
    style: row
    columns: 3
  Streaming e cataloghi:
    style: column
    Anime:
      style: column
  Infrastruttura:
    style: column
  Rete e proxy:
    style: column
    Consumo container:
      style: column
    Da completare:
      style: column
      initiallyCollapsed: true
background:
  image: data:image/webp;base64,
  brightness: 100
  saturate: 100
  opacity: 100
